<main>
<h3>追記∶性被害の訴え時に発生しやすい誤謬例その他</h3>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 968" width="100%" style="max-width:640px;display:block;margin:0 auto" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="12" fill="#333" role="img" aria-label="前件肯定式（正常）と後件肯定式（誤謬）の比較図">
<title>前件肯定式（正常）と後件肯定式（誤謬）</title>

<!-- A 前件肯定式 -->
<rect x="4" y="4" width="432" height="292" rx="4" fill="#fff" stroke="#ccc"/>
<path d="M4 34V8a4 4 0 0 1 4-4h424a4 4 0 0 1 4 4v26z" fill="#2a6f97"/>
<text x="16" y="25" font-size="15" font-weight="bold" fill="#fff">前件肯定式（正常）</text>
<text x="16" y="56">前提：性被害者ならば従順・懐柔反応をとる</text>
<rect x="52" y="62" width="110" height="17" fill="#ffff80"/>
<text x="16" y="75">前提：<tspan text-decoration="underline">私は性被害者である</tspan></text>
<text x="16" y="94">結論：私の振る舞いは従順・懐柔反応である</text>
<line x1="16" y1="108" x2="424" y2="108" stroke="#ddd"/>
<circle cx="100" cy="205" r="80" fill="#e3eef6" stroke="#2a6f97"/>
<circle cx="100" cy="225" r="42" fill="#bcd7ea" stroke="#2a6f97"/>
<g font-size="11" fill="#1b4965" text-anchor="middle">
<text x="100" y="152">P 甘い粉物</text>
<text x="100" y="212">M 砂糖</text>
</g>
<circle cx="100" cy="236" r="5" fill="#1b4965"/>
<text x="110" y="240" font-size="11" fill="#1b4965">s</text>
<g font-size="11.5">
<text x="200" y="134" font-weight="bold" fill="#2a6f97">定言変換</text>
<text x="200" y="158">①砂糖Mは甘い粉物Pである。</text>
<text x="200" y="178">②私sは砂糖Mを手にとった。</text>
<text x="200" y="198">③結論、手にとった粉物は甘かった。</text>
<rect x="200" y="214" width="232" height="50" rx="3" fill="#e8f5ec" stroke="#2e7d32"/>
<text x="208" y="234" fill="#2e7d32">s∈M⊂P　ゆえに　s∈P</text>
<text x="208" y="254">これなら主張の流れになんの矛盾もない。</text>
</g>

<!-- B 後件肯定式 -->
<g transform="translate(0,308)">
<rect x="4" y="4" width="432" height="426" rx="4" fill="#fff" stroke="#ccc"/>
<path d="M4 34V8a4 4 0 0 1 4-4h424a4 4 0 0 1 4 4v26z" fill="#b23a48"/>
<text x="16" y="25" font-size="15" font-weight="bold" fill="#fff">後件肯定式（誤謬）</text>
<text x="16" y="56">前提：性被害者ならば従順・懐柔反応をとる</text>
<text x="16" y="75">前提：私の振る舞いは従順・懐柔反応である</text>
<rect x="52" y="81" width="110" height="17" fill="#ffff80"/>
<text x="16" y="94">結論：<tspan text-decoration="underline">私は性被害者である</tspan></text>
<text x="16" y="116" font-size="10.5" fill="#555">★記号定義　大名辞P（大概念）　小名辞S（小概念）　中名辞M（媒概念）</text>
<circle cx="100" cy="205" r="80" fill="#e3eef6" stroke="#2a6f97"/>
<circle cx="100" cy="225" r="42" fill="#bcd7ea" stroke="#2a6f97"/>
<g font-size="11" fill="#1b4965" text-anchor="middle">
<text x="100" y="152">P 甘い粉物</text>
<text x="100" y="212">M 砂糖</text>
</g>
<g fill="#b23a48">
<circle cx="100" cy="238" r="5"/><text x="110" y="242" font-size="11">①s</text>
<circle cx="48" cy="205" r="5"/><text x="56" y="209" font-size="11">②s</text>
</g>
<g font-size="11.5">
<text x="200" y="134" font-weight="bold" fill="#b23a48">こちらはどうか → 定言変換</text>
<text x="200" y="158">①砂糖mは甘い粉物pである。</text>
<text x="200" y="178">②私sが手にとった粉物pは甘かった。</text>
<text x="200" y="198">③結論、私sの掌にある粉物は</text>
<text x="200" y="214">　砂糖mである。</text>
<rect x="200" y="226" width="232" height="66" rx="3" fill="#fdecee" stroke="#b23a48"/>
<text x="208" y="244" fill="#b23a48" font-weight="bold">中名辞不周延で端的に間違い。</text>
<text x="208" y="261">また定言三段論法で中名辞が結論部に</text>
<text x="208" y="278">残ることはない。</text>
</g>
<text x="16" y="318" fill="#b23a48">①砂糖である可能性もある</text>
<text x="16" y="338" fill="#b23a48">②砂糖でない可能性もある</text>
<line x1="16" y1="350" x2="424" y2="350" stroke="#ddd"/>
<text x="16" y="372">この場合、②の可能性を排除できない限り「ある」ものとして扱えない</text>
<text x="16" y="390">わけです。これを法律関係者が刑事司法の場面で無罪推定と表現して</text>
<text x="16" y="408">るだけで、そもそも法原則などという高尚な話でも何でもなく、推論</text>
<text x="16" y="426">を正しく実行できるかどうか、それだけのこと。</text>
</g>

<!-- C 使用される場面 -->
<g transform="translate(0,752)">
<rect x="4" y="4" width="432" height="212" rx="4" fill="#fff" stroke="#ccc"/>
<path d="M4 34V8a4 4 0 0 1 4-4h424a4 4 0 0 1 4 4v26z" fill="#555"/>
<text x="16" y="25" font-size="15" font-weight="bold" fill="#fff">使用される場面</text>
<rect x="16" y="44" width="408" height="58" rx="3" fill="#f6f6f6" stroke="#ddd"/>
<text x="28" y="64" font-size="11" font-weight="bold" fill="#2a6f97">被疑者サイド</text>
<text x="28" y="86">事中事後の対応は親密であり不同意を訴える内容と評価できない。</text>
<rect x="16" y="112" width="408" height="72" rx="3" fill="#f6f6f6" stroke="#ddd"/>
<text x="28" y="132" font-size="11" font-weight="bold" fill="#b23a48">被害申告サイド</text>
<text x="28" y="152">それは被害者に共通する心理傾向（従順・懐柔反応）である。</text>
<text x="28" y="170">ゆえに性被害があったと推定できる。</text>
<text x="16" y="204">たとえばこういうやつ。</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 428" width="100%" style="max-width:640px;display:block;margin:0 auto" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="12" fill="#333" role="img" aria-label="論理の逆走（後件肯定）の解説図">
<title>論理の逆走（後件肯定）の解説</title>
<defs>
<marker id="fsOk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2e7d32"/></marker>
<marker id="fsNg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b23a48"/></marker>
</defs>
<rect x="4" y="4" width="432" height="420" rx="4" fill="#fff" stroke="#ccc"/>

<text x="16" y="28">投稿者は被害者心理というけれど、ご指摘にある統計上の傾向が</text>
<text x="16" y="46">あったとしても、そうした統計事実を個別事件へ演繹可能かは別問題。</text>
<text x="16" y="64">上の論理分岐に当てはめると、裁判は大前提（性被害者ならば</text>
<text x="16" y="82">特徴Aがある）の前件を認定可能かを審理する場でしょう。そこを</text>
<text x="16" y="100">スキップして、被害者に見られる統計的傾向から</text>
<text x="16" y="118">sはpゆえにmを導いたらだめ。</text>
<rect x="76" y="123" width="62" height="17" fill="#ffff80"/>
<text x="16" y="136">この分岐は<tspan font-weight="bold" text-decoration="underline">論理の逆走</tspan>（後件肯定または中名辞不周延）で</text>
<text x="16" y="154">論点先取構造を持ち論理強度も弱い。</text>

<g font-size="11" text-anchor="middle">
<rect x="16" y="172" width="148" height="34" rx="3" fill="#e8f5ec" stroke="#2e7d32"/>
<text x="90" y="194">性被害者である（前件）</text>
<rect x="276" y="172" width="148" height="34" rx="3" fill="#e8f5ec" stroke="#2e7d32"/>
<text x="350" y="194">特徴Aがある（後件）</text>
<text x="220" y="224" fill="#2e7d32">前件肯定：正しい推論（裁判は前件の認定を審理する場）</text>
<rect x="16" y="240" width="148" height="34" rx="3" fill="#fdecee" stroke="#b23a48"/>
<text x="90" y="262">性被害者である</text>
<rect x="276" y="240" width="148" height="34" rx="3" fill="#fdecee" stroke="#b23a48"/>
<text x="350" y="262">特徴Aがある</text>
<text x="220" y="250" font-size="14" font-weight="bold" fill="#b23a48">×</text>
<text x="220" y="294" fill="#b23a48">後件肯定（逆走）：論点先取で論理強度が弱い</text>
<text x="220" y="316" fill="#666">（sはmゆえにpが正しい推論）</text>
<text x="220" y="332" fill="#666">（仮言だとp∴qが正しい推論）</text>
</g>
<line x1="164" y1="189" x2="276" y2="189" stroke="#2e7d32" stroke-width="2" marker-end="url(#fsOk)"/>
<line x1="276" y1="257" x2="164" y2="257" stroke="#b23a48" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#fsNg)"/>

<text x="16" y="360">論理強度は<a href="https://24-blog.github.io/bayes/" target="_blank" rel="noopener"><tspan fill="#0b5fa5" text-decoration="underline">ベイズ理論</tspan></a>からも説明可能で</text>
<text x="16" y="378">一審の論理精度の低さが高裁で糺された好例。</text>
<text x="16" y="406">つまり、被害者心理に対する無理解でも無視でも逃げでもなく理路の修正。</text>
</svg>

<p class="r-fuki aoki">※最後に念押し。私の記事は法律の話をしてません。</p>
